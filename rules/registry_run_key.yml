title: Registry Run Key Modification
id: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
status: experimental
description: Detects modification of registry Run keys (Sysmon Event ID 13), a common persistence mechanism.
author: ZenshiroDarkuOwO
date: 2026/11/05
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    product: windows
    category: registry_event
detection:
    selection:
        EventID: 13
        TargetObject|contains:
            - '\CurrentVersion\Run\'
            - '\CurrentVersion\RunOnce\'
    condition: selection
falsepositives:
    - Legitimate software adding startup entries
level: medium