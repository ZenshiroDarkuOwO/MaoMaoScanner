title: Multiple Failed Logons
name: multiple_failed_logons
id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
status: stable
description: Detects failed logon attempts (Event ID 4625) on Windows systems.
author: ZenshiroDarkuOwO
date: 2026/11/04
tags:
    - attack.credential_access
    - attack.t1110
    - attack.t1110.001
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection
falsepositives:
    - User mistyping password repeatedly
    - Misconfigured service account with stale credentials
level: informational

---

title: Successful Logon
name: successful_logon
id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
status: stable
description: Detects a successful Windows logon (Event ID 4624) excluding machine and system accounts, to reduce noise.
author: ZenshiroDarkuOwO
date: 2026/11/05
tags:
    - attack.credential_access
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
    filter_machine_accounts:
        TargetUserName|endswith: '$'
    filter_system_accounts:
        TargetUserName:
            - 'SYSTEM'
            - 'LOCAL SERVICE'
            - 'NETWORK SERVICE'
            - 'ANONYMOUS LOGON'
            - 'DWM-1'
            - 'DWM-2'
            - 'UMFD-0'
            - 'UMFD-1'
    condition: selection and not (filter_machine_accounts or filter_system_accounts)
level: informational

---

title: Multiple Failed Logons Followed by Successful Logon
id: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
status: stable
description: Detects a successful logon after multiple failed attempts from the same source IP within a short window, indicating a probable brute force success.
author: ZenshiroDarkuOwO
date: 2026/11/04
references:
    - https://attack.mitre.org/techniques/T1110/
    - https://owasp.org/Top10/2025/A07_2025-Authentication_Failures/
tags:
    - attack.credential_access
    - attack.t1110
    - attack.t1110.001
correlation:
    type: temporal_ordered
    rules:
        - multiple_failed_logons
        - successful_logon
    group-by:
        - IpAddress
    timespan: 10m
    condition:
        gte: 5
level: high
falsepositives:
    - Legitimate user who forgot password then remembered it
    - Automated scripts with retry logic and eventual success