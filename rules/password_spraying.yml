title: Kerberos Password Spraying
id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
status: experimental
description: Detects multiple Kerberos authentication failures (Event IDs 4768 and 4771) from the same source, a common indicator of password spraying attacks against Active Directory.
author: ZenshiroDarkuOwO
date: 2026/11/05
references:
    - https://attack.mitre.org/techniques/T1110/003/
tags:
    - attack.credential_access
    - attack.t1110.003
logsource:
    product: windows
    service: security
detection:
    selection_4771:
        EventID: 4771
    selection_4768_fail:
        EventID: 4768
        Status:
            - '0x6'
            - '0x18'
    condition: selection_4771 or selection_4768_fail
falsepositives:
    - Users with expired passwords
    - Misconfigured applications with stale credentials
level: medium